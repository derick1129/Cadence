[project]
name = "cadence-worker"
version = "0.1.0"
description = "Cadence stateless voice agent worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["livekit.*", "livekit.agents.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".."]

